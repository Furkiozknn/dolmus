<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b1f2a">
<title>Dolmuş</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%231b1f2a%27/%3E%3Crect x=%273%27 y=%2711%27 width=%2726%27 height=%2713%27 rx=%274%27 fill=%27%23FACC15%27/%3E%3Ccircle cx=%2710%27 cy=%2725%27 r=%273%27 fill=%27%23fff%27/%3E%3Ccircle cx=%2722%27 cy=%2725%27 r=%273%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<style>
:root{
  --accent:#FACC15; --accent-d:#d4a90a; --ink:#fff7e0; --dim:#b9bfcc;
  --glass:rgba(22,25,36,.62); --glass-b:rgba(255,255,255,.14); --bad:#ff6b5e; --good:#7be08a;
  --r:16px; --fs:15px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1f2a;color:var(--ink);
  font:700 var(--fs)/1.3 "Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ic.fill{fill:currentColor;stroke:none}
.glass{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-b);
  border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.28)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,.slider:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{min-height:44px;min-width:44px;padding:10px 20px;border-radius:14px;border:2px solid var(--glass-b);background:rgba(255,255,255,.08);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;letter-spacing:.2px;transition:transform .08s,background .15s}
.btn:hover{background:rgba(255,255,255,.16)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#2a2100;border-color:#fff3b0;box-shadow:0 4px 0 var(--accent-d)}
.btn.primary:hover{background:#ffd93a}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.icon{padding:0;width:44px}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud>*{pointer-events:none}
#hud>#minimap{pointer-events:auto;cursor:pointer}
#topbar{position:absolute;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));
  display:flex;align-items:center;gap:10px;padding:6px 10px;pointer-events:auto}
#topbar .brand{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:1px;color:var(--accent);margin-right:4px}
#topbar .brand svg{width:34px;height:26px}
.stat{display:flex;flex-direction:column;align-items:flex-start;min-width:54px;line-height:1.1}
.stat small{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;display:flex;gap:4px;align-items:center}
.stat small svg.ic{width:12px;height:12px}
.stat b{font-size:17px;font-variant-numeric:tabular-nums}
.stat.fare{flex:1 1 150px;min-width:130px;max-width:300px}
.bar{height:9px;border-radius:6px;background:rgba(255,255,255,.14);position:relative;overflow:hidden;width:100%;margin-top:3px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--accent);width:0}
.bar.dent i{background:linear-gradient(90deg,#7be08a,#facc15 55%,#ff6b5e)}
.bar u{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.7)}
#topbar .btns{margin-left:auto;display:flex;gap:6px}
.stat.sm{min-width:70px}
#toasts{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--barh,56px) + max(8px,env(safe-area-inset-top)) + 8px);display:flex;flex-direction:column;gap:6px;align-items:center;width:min(92vw,520px)}
.toast{padding:8px 16px;border-radius:12px;background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(10px);font-weight:800;text-align:center;animation:tin .25s ease-out;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.toast.good{border-color:var(--good);color:#d9ffe0}.toast.bad{border-color:var(--bad);color:#ffd9d4}.toast.info{border-color:var(--accent);color:var(--ink)}
.toast.out{opacity:0;transform:translateY(-6px);transition:all .35s}
@keyframes tin{from{opacity:0;transform:translateY(-8px) scale(.96)}to{opacity:1;transform:none}}
#minimap{position:absolute;left:max(8px,env(safe-area-inset-left));bottom:max(8px,env(safe-area-inset-bottom));width:210px;height:158px;border-radius:14px;border:1px solid var(--glass-b);box-shadow:0 8px 24px rgba(0,0,0,.28);background:rgba(22,25,36,.55)}
#speedo{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));width:116px;height:116px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(10px)}
#speedo svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(135deg)}
#speedo circle{fill:none;stroke-width:8;stroke-linecap:round}
#spArc{stroke:var(--accent)}
#speedo div{text-align:center;line-height:1}
#speedo b{font-size:30px;display:block;font-variant-numeric:tabular-nums}
#speedo small{font-size:10px;color:var(--dim)}
#seatsStrip{position:absolute;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:6px;padding:8px 10px}
.seat{width:30px;height:34px;border-radius:9px 9px 6px 6px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.22);position:relative;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#1d1d1d}
.seat.on{border-color:#fff}
.seat i{position:absolute;left:3px;right:3px;bottom:2px;height:3px;border-radius:2px;background:var(--good)}
#guide{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(8px,env(safe-area-inset-top)) + 64px);display:none}
#guideBox{position:absolute;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 64px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:6px 14px;white-space:nowrap}
#guideArrow{width:30px;height:30px;color:var(--accent);transition:transform .08s linear}
#guideArrow svg{width:30px;height:30px;fill:currentColor;stroke:none}
#guideTxt{font-size:13px}#guideTxt small{display:block;color:var(--dim);font-size:11px}
#hint{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:calc(max(10px,env(safe-area-inset-bottom)) + 128px);padding:6px 12px;font-size:12px;color:var(--dim);text-align:right}
#hint b{color:var(--accent)}
#floaters,#bubbles{position:absolute;inset:0;overflow:hidden}
.floater{position:absolute;font-weight:900;font-size:22px;color:var(--accent);text-shadow:0 2px 0 rgba(0,0,0,.55);animation:fup 1.4s ease-out forwards;transform:translate(-50%,-50%);white-space:nowrap}
.floater.neg{color:var(--bad)}
@keyframes fup{0%{opacity:0;margin-top:0}12%{opacity:1}100%{opacity:0;margin-top:-70px}}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#fffbe8;color:#2b2410;padding:6px 12px;border-radius:14px 14px 14px 3px;font-size:13px;font-weight:800;box-shadow:0 4px 10px rgba(0,0,0,.35);animation:tin .2s ease-out;white-space:nowrap;max-width:60vw}
.bubble.out{opacity:0;transition:opacity .4s}
/* touch */
#touch{position:absolute;inset:0;display:none}
body.touch #touch{display:block}
#steer{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));width:min(calc(100vw - 232px),300px);min-width:150px;height:64px;border-radius:32px;pointer-events:auto;touch-action:none}
#steer i{position:absolute;top:6px;left:50%;width:52px;height:52px;margin-left:-26px;border-radius:50%;background:var(--accent);box-shadow:0 4px 0 var(--accent-d)}
#steer::before{content:"";position:absolute;left:14px;right:14px;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:rgba(255,255,255,.3)}
.pedal{position:absolute;pointer-events:auto;touch-action:none;border-radius:20px;display:flex;align-items:center;justify-content:center;font-weight:900;border:2px solid var(--glass-b)}
.pedal.on{background:rgba(250,204,21,.4);border-color:var(--accent)}
#pGas{right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:84px;height:116px}
#pBrake{right:calc(max(14px,env(safe-area-inset-right)) + 94px);bottom:max(14px,env(safe-area-inset-bottom));width:72px;height:90px}
#tDoor{right:max(14px,env(safe-area-inset-right));bottom:calc(max(14px,env(safe-area-inset-bottom)) + 126px);width:84px;height:52px}
#tHorn{right:calc(max(14px,env(safe-area-inset-right)) + 94px);bottom:calc(max(14px,env(safe-area-inset-bottom)) + 100px);width:72px;height:48px}
body.touch #minimap{bottom:auto;top:calc(var(--barh,66px) + max(8px,env(safe-area-inset-top)) + 8px);width:132px;height:100px}
body.touch #speedo{bottom:auto;right:max(8px,env(safe-area-inset-right));top:calc(var(--barh,66px) + max(8px,env(safe-area-inset-top)) + 8px);width:68px;height:68px}
body.touch #speedo b{font-size:19px}body.touch #speedo small{font-size:8px}
body.touch #seatsStrip{left:max(14px,env(safe-area-inset-left));transform:none;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 72px);padding:4px 6px;gap:3px}
body.touch .seat{width:17px;height:21px;font-size:10px;border-radius:6px 6px 4px 4px;border-width:1.5px}
body.touch .seat i{left:2px;bottom:1px;height:2px}
body.touch #hint{display:none}
body.touch #guideBox{left:max(14px,env(safe-area-inset-left));transform:none;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 108px);padding:4px 10px}
body.touch #toasts{top:calc(var(--barh,66px) + max(8px,env(safe-area-inset-top)) + 12px)}
@media (orientation:portrait){body.touch #toasts{top:calc(var(--barh,66px) + max(8px,env(safe-area-inset-top)) + 116px)}body.touch #seatsStrip{flex-wrap:wrap;width:136px}body.touch #guideBox{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 152px)}}
/* screens */
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;padding:12px;overflow:auto;touch-action:pan-y}
.screen.show{display:flex}
.screen.dim{background:rgba(10,12,20,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.card{width:min(92vw,520px);padding:22px 24px;text-align:center;max-height:96vh;overflow:auto}
.card h1{margin:6px 0 2px;font-size:44px;letter-spacing:3px;color:var(--accent);text-shadow:0 3px 0 rgba(0,0,0,.4)}
.card h2{margin:4px 0 8px;font-size:26px;color:var(--accent)}
.card p{margin:6px 0;color:#e8ebf2;font-weight:600}
.card .sub{color:var(--ink);font-size:17px}
.card .how{font-size:13.5px;color:var(--dim)}
.col{display:flex;flex-direction:column;gap:10px;margin-top:14px;align-items:stretch}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#logoBig{width:200px;height:110px;margin:0 auto;display:block;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.best{font-size:13px;color:var(--dim);margin-top:10px}
.foot{margin-top:14px;font-size:12px;color:var(--dim)}
.foot a{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent)}
.set{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center;text-align:left;margin-top:10px}
.set label{font-weight:800}
.set output{width:42px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:44px;accent-color:var(--accent);background:transparent}
.seg{display:flex;gap:6px;grid-column:2/4}
.seg .btn{flex:1;padding:8px 10px}
.seg .btn.sel{background:var(--accent);color:#2a2100;border-color:#fff3b0}
.stars{display:flex;gap:6px;justify-content:center;margin:6px 0}
.stars svg{width:46px;height:46px;fill:rgba(255,255,255,.16);stroke:rgba(255,255,255,.3);stroke-width:1.5}
.stars svg.on{fill:var(--accent);stroke:#fff3b0;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35));animation:pop .5s ease-out both}
@keyframes pop{from{transform:scale(.3) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 14px;text-align:left;margin:10px 0;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.07)}
.kv span:nth-child(odd){color:var(--dim)}.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.kv .neg{color:var(--bad)}.kv .pos{color:var(--good)}
.rec{color:var(--accent);font-weight:900;animation:pulse 1s infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
ul.feat{list-style:none;padding:0;margin:8px 0;text-align:left}
ul.feat li{padding:5px 10px;margin:4px 0;border-radius:10px;background:rgba(255,255,255,.07);font-size:14px}
ul.feat li::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:8px}
#dbg{position:fixed;left:8px;top:92px;z-index:50;font:12px/1.35 monospace;color:#9fffa8;background:rgba(0,0,0,.6);padding:6px 8px;border-radius:6px;white-space:pre;pointer-events:none;display:none;max-width:60vw}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,20,.35));opacity:.9}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:6;box-shadow:inset 0 0 90px 20px rgba(255,60,40,.8);opacity:0;transition:opacity .35s}
@media (max-width:760px){
  :root{--fs:13px}
  #topbar{gap:6px;padding:5px 7px;flex-wrap:wrap}
  #topbar .brand span{display:none}
  .stat b{font-size:14px}.stat small{font-size:9px}
  .stat.fare{flex:1 1 100px;min-width:96px}
  .stat.sm{min-width:48px}
  #minimap{width:150px;height:113px;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 52px)}
  .seat{width:20px;height:24px;font-size:11px}#seatsStrip{gap:4px;padding:5px 7px}
  #guideBox{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 52px)}
  .card h1{font-size:34px}
  #speedo{width:92px;height:92px}#speedo b{font-size:24px}
}
@media (max-height:520px){
  .card{padding:12px 16px}.card h1{font-size:30px}#logoBig{width:130px;height:70px}
  #minimap{width:150px;height:113px;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 52px)}
  .seat{width:20px;height:24px;font-size:11px}#seatsStrip{gap:4px;padding:5px 7px}
  #guideBox{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 52px)}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor" stroke="none"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor" stroke="none"/></symbol>

    <symbol id="i-sfx" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></symbol>

    <symbol id="i-horn" viewBox="0 0 24 24"><path d="M3 10v4h3l7 4V6L6 10z" fill="currentColor"/><path d="M16 8l3-2M16 12h4M16 16l3 2"/></symbol>

<canvas id="gl" aria-label="Dolmuş"></canvas>
<div id="vignette"></div><div id="hurt"></div>

<div id="hud" class="hidden">
  <div id="topbar" class="glass">
    <div class="brand"><svg viewBox="0 0 68 52"><use href="#logo"/></svg><span>DOLMUŞ</span></div>
    <div class="stat sm"><small data-i="level"></small><b id="stLevel">1</b></div>
    <div class="stat sm"><small><svg class="ic"><use href="#i-clock"/></svg><span data-i="shift"></span></small><b id="stClock">4:00</b></div>
    <div class="stat fare"><small><svg class="ic"><use href="#i-coin"/></svg><span data-i="fares"></span></small><b id="stFare">0 / 100</b><div class="bar" id="fareBar"><i></i><u style="left:50%"></u><u style="left:75%"></u></div></div>
    <div class="stat sm"><small><svg class="ic"><use href="#i-person"/></svg><span data-i="seats"></span></small><b id="stSeats">0/12</b></div>
    <div class="stat sm" style="min-width:84px"><small><svg class="ic"><use href="#i-dent"/></svg><span data-i="dents"></span></small><div class="bar dent" id="dentBar"><i></i></div></div>
    <div class="btns">
      <button class="btn icon" id="bPause" data-t="pause" aria-label="Pause"><svg class="ic"><use href="#i-pause"/></svg></button>
      <button class="btn icon" id="bSound" data-t="sound" aria-label="Sound"><svg class="ic"><use href="#i-sfx"/></svg></button>
      <button class="btn icon" id="bLang" data-t="language" aria-label="Language"><svg class="ic"><use href="#i-globe"/></svg></button>
    </div>
  </div>

    for (const a of AG) {
      if (a.kind === 'player') continue;
      const dx = a.x - _tp.x, dz = a.z - _tp.z, rr = a.r + 1.5;
      if (dx * dx + dz * dz < rr * rr) { hit = true; break; }
    }
    if (hit) { gap = Math.min(gap, k - 1); break; }
  }
  return gap;
}
function botTick(dt) {
  if (BOT.lastState !== G.state) { BOT.lastState = G.state; BOT.uiT = 0; }
  BOT.uiT += dt;
  const act = (th, fn) => { if (BOT.uiT > th) { BOT.uiT = 0; fn(); } };
  if (G.done) return;
  if (G.state === 'title') { act(0.8, () => startCampaign(false)); return; }
  if (G.state === 'intro') { act(0.8, beginShift); return; }
  if (G.state === 'paused') { resumeGame(); return; }
  if (G.state === 'end') {
    act(1.2, () => {
      const r = G.lastResult;
      if (G.mode === 'campaign' && G.lvIdx >= 7 && r.stars > 0) { G.done = true; return; }
      if (Q.has('cal')) { if (G.lvIdx >= 7) { G.done = true; return; } G.lvIdx++; G.retries = 0; enterIntro(); return; }
      if (r.stars > 0 && r.kind !== 'wreck') nextAction();
      else { if (G.retries >= 3) { G.done = true; G.failed = true; return; } retryCurrent(); }
    });
    return;
  }
  if (G.state !== 'play') return;
  const P = player, path = SIM.route, sp = P.vf;
  input.horn = false;
  if (BOT.rev > 0) { BOT.rev -= dt; input.throttle = 0; input.brake = 1; input.steer = BOT.revSteer; return; }
  if (P.door.state !== 'closed' || P.stopReq || P.boarding > 0) { input.throttle = 0; input.brake = 0; input.steer = 0; BOT.stuck = 0; return; }
  const look = 6 + Math.abs(sp) * 0.5;
  pathAt(path, P.routeS + look, _tp);
  const ang = wrapAng(Math.atan2(_tp.x - P.x, _tp.z - P.z) - P.hd);
  input.steer = clamp(-ang * 2.2, -1, 1);
  let vT = Math.min(pathV(path, P.routeS + look * 1.5) * 1.1, 16) * (SIM.rain > 0.4 ? 0.82 : 1);
  const gap = botGap(path, P.routeS);
  if (gap < 1e8) vT = Math.min(vT, Math.sqrt(2 * 4 * Math.max(gap - 1.0, 0)));
  const g = guideTarget();
  if (g && g.kind !== 'cruise' && g.d < 90) {
    vT = Math.min(vT, Math.sqrt(2 * 3.5 * Math.max(g.d - 3, 0)) + 2.0);
    if (g.d < 16 && sp < 11 && hasBusiness()) doorPress();
  }
  const e = vT - sp;
  input.throttle = e > 0.2 ? clamp(e * 0.6, 0, 1) : 0;
  input.brake = e < -0.8 ? clamp((-e - 0.8) * 0.3, 0, 0.7) : 0;
  if (gap < 7 && sp > 3 && vT < sp - 3) input.brake = Math.max(input.brake, 0.9);
  if (Math.abs(sp) < 0.4 && gap > 4 && vT > 1) BOT.stuck += dt; else BOT.stuck = 0;
  if (BOT.stuck > 6) { BOT.stuck = 0; BOT.rev = 1.5; BOT.revSteer = (R() < 0.5 ? -1 : 1); }
}

// ---------------------------------------------------------------- main loop
let lastT = performance.now(), acc = 0, fpsS = 60, ambT = 6, frameN = 0;
const FIXED = 1 / 60;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now; if (!(dt > 0)) dt = 0.016; dt = Math.min(dt, 0.1);
  if (document.hidden) return;
  if (G.state === 'loading') return;
  fpsS += (1 / Math.max(dt, 1e-3) - fpsS) * 0.05;
  if (FLAG.auto) botTick(dt); else readInput();
  if (G.state === 'play' || G.state === 'title') {
    acc += dt; let n = 0;
    while (acc >= FIXED && n < 4) { stepSim(FIXED); acc -= FIXED; n++; }
    if (acc > FIXED * 4) acc = 0;
  }
  const active = G.state === 'play';
  AUD.update(Math.abs(player.vf), active ? player.thr : 0, player.load, SIM.rain, 0, active, player.skid);
  if (active) { ambT -= dt; if (ambT <= 0) { ambT = 6 + Math.random() * 9; AUD.honk(280 + Math.random() * 120, 0.25, 0.035); if (Math.random() < 0.15) AUD.ferry(); } }
  syncRender(G.state === 'paused' ? 0 : dt);
  if (G.state !== 'title') { updateHUD(dt); updateBubbles(dt); } else updateBubbles(dt);
  if (G.state === 'play' || G.state === 'paused' || G.state === 'intro') { if ((frameN++ & 1) === 0) drawMinimap(); }
  renderer.render(scene, camera);
  if (FLAG.debug) debugOverlay();
}
function debugOverlay() {
  const i = renderer.info.render;
  el.dbg.style.display = 'block';
  el.dbg.textContent = 'fps ' + fpsS.toFixed(0) + ' · calls ' + i.calls + ' · tris ' + i.triangles + ' · pts ' + i.points + '\n' +
    'state ' + G.state + ' · lv ' + (SIM.lv ? SIM.lv.id : '-') + ' · t ' + SIM.t.toFixed(1) + ' · net ' + (SC ? Math.round(netScore()) : 0) + '/' + (SIM.lv ? SIM.lv.target : 0) + ' · dent ' + Math.round(player.dent) + '\n' +
    'cars ' + SIM.cars.length + ' peds ' + SIM.peds.length + ' seats ' + player.seats.length + ' rain ' + SIM.rain.toFixed(2) + '\n' +
    'results ' + G.log.map(r => r.level + ':' + r.stars + '★/' + r.net).join(' ') + (G.done ? ' · DONE' : '') + '\n' +
    'errors ' + G.errors.length + (G.errors.length ? '\n' + G.errors.slice(-3).join('\n') : '');
}
window.addEventListener('error', e => { G.errors.push((e.message || 'error') + ' @' + (e.lineno || '?') + ':' + (e.colno || '?')); });
window.addEventListener('unhandledrejection', e => { G.errors.push('promise: ' + (e.reason && e.reason.message || e.reason)); });

// fast-forward without rendering
window.dolmusSim = function (seconds) {
  const dt = 1 / 30, n = Math.round(seconds / dt);
  for (let i = 0; i < n; i++) {
    if (G.done) break;
    if (FLAG.auto) botTick(dt); else if (G.state === 'play') readInput();
    if (G.state === 'play' || G.state === 'title') stepSim(dt);
  }
  return window.dolmus;
};
window.dolmus = {
  G, SIM, player, input, AUD, STR, WORLD, ASSETS, DBG, camClear, camState, staticHits, obAll, scene, renderer, camera,
  get state() { return G.state; }, get level() { return SIM.lv && SIM.lv.id; }, get time() { return SIM.t; },
  get net() { return SC ? netScore() : 0; }, get score() { return SC; }, get seats() { return player.seats.length; }, get dent() { return player.dent; },
  get speed() { return player.speed; }, get log() { return G.log; }, get done() { return G.done; }, get errors() { return G.errors; },
  get hour() { return SIM.hour; }, get rain() { return SIM.rain; },
  start(lv) { if (lv) G.lvIdx = lv - 1; startCampaign(false); if (lv) { G.lvIdx = lv - 1; enterIntro(); } beginShift(); },
  get gpu() { try { const gl = renderer.getContext(), e = gl.getExtension('WEBGL_debug_renderer_info'); return e ? gl.getParameter(e.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER); } catch (err) { return '?'; } },
  stats() { return { calls: renderer.info.render.calls, tris: renderer.info.render.triangles, fps: fpsS, cars: SIM.cars.length, peds: SIM.peds.length }; },
};

// ---------------------------------------------------------------- boot
async function boot() {
  const stages = [0, 1, 2, 3, 4];
  loadTotal = stages.length + 3;
  const yieldUI = () => new Promise(r => setTimeout(r, 0));
  const step = async fn => { fn(); loadN++; el.playTxt.textContent = t('loading', loadN, loadTotal); await yieldUI(); };
  applyLang(); syncSettingsUI();
  WR = mulberry(1234);
  for (const s of stages) await step(() => buildWorldGeometry(s));
  await step(() => { buildScene(); applyQuality(); });
  await step(() => { buildMinimapBase(); });
  await step(() => { for (const k of ['carB', 'busB', 'pedB', 'pedH', 'pedA', 'rings', 'beams']) { OBJ[k].setColorAt(0, _c.setHex(0xffffff)); } for (let i = 0; i < WORLD.sigHeads.length * 3; i++) OBJ.sig.setColorAt(i, _c.setHex(0x333333)); });
  G.state = 'title'; el.bPlay.disabled = false; window.__dolmusReady = true; if (!lsGet(KEY_SET)) saveSettings();
  showcase(); applyLang();
  if (FLAG.auto || SIM_PRE > 0) {
    if (G.state === 'title') { if (Q.get('mode') === 'endless') startEndless(); else startCampaign(false); beginShift(); }
    if (SIM_PRE > 0) window.dolmusSim(SIM_PRE);
    lastSkyHour = -99;
  }
  lastT = performance.now(); requestAnimationFrame(frame);
  setTimeout(loadAssets, 60);
}
boot().catch(err => { G.errors.push('boot: ' + (err && err.stack || err)); const m = document.getElementById('playTxt'); if (m) m.textContent = 'Error: ' + (err && err.message); console.error(err); if (el.dbg) { el.dbg.style.display = 'block'; el.dbg.textContent = String(err && err.stack || err); } });
</script>
